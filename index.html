<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Um desafio pra você 💌</title>
<meta property="og:title" content="Um desafio pra você 💌">
<meta property="og:description" content="Acerte 10 perguntas sobre mim pra destravar uma surpresa.">
<meta name="theme-color" content="#2a0f1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a0f1c;
    --bg2: #4a1430;
    --card: #fff8f4;
    --ink: #2b1720;
    --muted: #8a6a76;
    --rosa: #e0457b;
    --rosa-escuro: #b8285c;
    --ok: #2f9e6b;
    --linha: #f0dfe4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%) fixed;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  #coracoes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  #coracoes span {
    position: absolute; bottom: -40px; opacity: .0;
    animation: subir linear infinite;
  }
  @keyframes subir {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    10% { opacity: .35; }
    100% { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    background: var(--card);
    border-radius: 24px;
    padding: 32px 24px 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    text-align: center;
  }
  .tela { display: none; }
  .tela.ativa { display: block; animation: entrar .45s ease; }
  @keyframes entrar { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  h1, h2, .serif { font-family: Fraunces, Georgia, serif; }
  h1 { font-size: 34px; margin: 8px 0 12px; font-weight: 600; }
  h2 { font-size: 24px; line-height: 1.3; margin: 8px 0 22px; font-weight: 600; }
  p { line-height: 1.6; }
  .grande { font-size: 56px; line-height: 1; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  button {
    font: 600 17px Inter, system-ui, sans-serif;
    border: 0; border-radius: 14px;
    background: var(--rosa); color: #fff;
    padding: 16px 20px; width: 100%;
    cursor: pointer; transition: background .2s, transform .1s;
  }
  button:hover { background: var(--rosa-escuro); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: wait; }
  .topo { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); font-weight: 500; }
  .barra { height: 8px; background: var(--linha); border-radius: 99px; margin: 10px 0 24px; overflow: hidden; }
  .barra > div { height: 100%; width: 0; background: linear-gradient(90deg, #ff7aa2, var(--rosa)); border-radius: 99px; transition: width .5s ease; }
  input {
    width: 100%; font: 18px Inter, system-ui, sans-serif;
    padding: 15px 16px; border-radius: 14px;
    border: 2px solid var(--linha); background: #fff; color: var(--ink);
    outline: none; margin-bottom: 12px; text-align: center;
  }
  input:focus { border-color: var(--rosa); }
  .tremer { animation: tremer .4s; border-color: var(--rosa) !important; }
  @keyframes tremer { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .acertou { border-color: var(--ok) !important; }
  #msg { min-height: 24px; margin: 4px 0 0; font-size: 15px; color: var(--rosa-escuro); font-weight: 500; }
  #msg.ok { color: var(--ok); }
  .estrelas { font-size: 20px; letter-spacing: 4px; margin-top: 18px; }
  .carta { text-align: left; }
  .carta h1 { text-align: center; }
  .carta .texto { font-family: Fraunces, Georgia, serif; font-size: 18px; line-height: 1.75; }
  .carta .texto p { margin: 0 0 1.1em; white-space: pre-line; }
  .envelope { font-size: 72px; cursor: pointer; display: inline-block; animation: pulsar 1.4s ease-in-out infinite; user-select: none; }
  @keyframes pulsar { 50% { transform: scale(1.08); } }
  .estouro { position: fixed; z-index: 5; pointer-events: none; font-size: 22px; animation: estouro .9s ease-out forwards; }
  @keyframes estouro { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
  .fundo-modal { position: fixed; inset: 0; z-index: 10; background: rgba(20,5,12,.7); display: none; align-items: center; justify-content: center; padding: 16px; }
  .fundo-modal.aberto { display: flex; animation: entrar .35s ease; }
  .vale {
    width: 100%; max-width: 360px; text-align: center;
    background: linear-gradient(160deg, #fff4d6, #ffe0ea);
    border: 3px dashed var(--rosa); border-radius: 22px;
    padding: 28px 22px 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.6) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .vale .etiqueta { font: 600 13px Inter, sans-serif; letter-spacing: 3px; color: var(--rosa-escuro); }
  .vale .titulo { font: 600 34px Fraunces, Georgia, serif; margin: 6px 0 2px; }
  .vale .valor { font: 600 44px Fraunces, Georgia, serif; color: var(--rosa); margin: 4px 0 10px; }
  .vale .validade { display: inline-block; background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px; margin: 8px 0 20px; }
  #botaoVale { margin-top: 12px; background: #f5c542; color: var(--ink); }
  #botaoVale:hover { background: #e9b52a; }
</style>
</head>
<body>
<div id="coracoes" aria-hidden="true"></div>

<main class="card">
  <section class="tela ativa" id="inicio">
    <div class="grande">💌</div>
    <h1>Oi, amor</h1>
    <p class="sub">Eu escrevi uma coisa pra você.<br>Mas antes, prova que me conhece: são <b>10 perguntas sobre mim</b>. Acertou todas, a surpresa abre.</p>
    <button id="comecar">Começar</button>
  </section>

  <section class="tela" id="quiz">
    <div class="topo"><span id="contador">Pergunta 1 de 10</span><span id="acertos">0 ❤️</span></div>
    <div class="barra"><div id="progresso"></div></div>
    <h2 id="pergunta"></h2>
    <form id="form" autocomplete="off">
      <input id="resposta" type="text" placeholder="Sua resposta…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button id="enviar" type="submit">Responder</button>
    </form>
    <p id="msg"></p>
  </section>

  <section class="tela" id="fim">
    <div class="grande">🏆</div>
    <h1>Acertou tudo!</h1>
    <p class="sub">Você me conhece mesmo. Agora toca no envelope.</p>
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir carta">✉️</div>
  </section>

  <section class="tela carta" id="carta">
    <h1>Pra você ❤️</h1>
    <div class="texto" id="texto"></div>
    <div id="fimDaCarta"></div>
    <button id="botaoVale" type="button">🎁 Tem mais uma coisa…</button>
  </section>
</main>

<div class="fundo-modal" id="modalVale" role="dialog" aria-modal="true">
  <div class="vale">
    <div class="etiqueta">VOCÊ GANHOU</div>
    <div class="grande">🍰</div>
    <div class="titulo" id="valeTitulo"></div>
    <div class="valor" id="valeValor"></div>
    <p id="valeTexto" style="margin:0"></p>
    <div class="validade" id="valeValidade"></div>
    <button id="fecharVale" type="button">Eba! 😍</button>
  </div>
</div>

const CHAVE_SALVA = 'quiz-amor-progresso';
const ERROS = [
  'Hmm… não é isso não 👀',
  'Errou! Tenta de novo 😅',
  'Tem certeza que me conhece? 🤨',
  'Quase… ou não. Tenta outra 😂',
  'Pensa mais um pouquinho 💭',
];
const ACERTOS = ['Isso! ❤️', 'Acertou! 😍', 'Sabia que você sabia 🥰', 'Boa! 💘', 'Exatamente! ✨'];

const $ = (id) => document.getElementById(id);
const dec = new TextDecoder();
const enc = new TextEncoder();
const deB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const paraB64 = (u8) => btoa(String.fromCharCode(...u8));
const normalizar = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const sorteia = (lista) => lista[Math.floor(Math.random() * lista.length)];

let segredos = [];
try { segredos = (JSON.parse(localStorage.getItem(CHAVE_SALVA)) || []).map(deB64); } catch (e) { segredos = []; }
const salvar = () => { try { localStorage.setItem(CHAVE_SALVA, JSON.stringify(segredos.map(paraB64))); } catch (e) {} };

function mostrar(id) {
  document.querySelectorAll('.tela').forEach((t) => t.classList.remove('ativa'));
  $(id).classList.add('ativa');
}

function carregarPergunta() {
  const i = segredos.length;
  const total = DADOS.quiz.length;
  if (i >= total) return mostrar('fim');
  $('contador').textContent = `Pergunta ${i + 1} de ${total}`;
  $('acertos').textContent = `${i} ❤️`;
  $('progresso').style.width = (i / total * 100) + '%';
  $('pergunta').textContent = DADOS.quiz[i].pergunta;
  $('resposta').value = '';
  $('resposta').classList.remove('acertou');
  $('msg').textContent = '';
  $('msg').className = '';
  $('resposta').focus({ preventScroll: true });
}

async function testar(resposta, item) {
  const base = await crypto.subtle.importKey('raw', enc.encode(normalizar(resposta)), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: deB64(item.salt), iterations: DADOS.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  for (const t of item.travas) {
    try {
      return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(t.iv) }, chave, deB64(t.ct)));
    } catch (e) { /* não é essa */ }
  }
  return null;
}

function estourarCoracoes(el) {
  const r = el.getBoundingClientRect();
  for (let k = 0; k < 12; k++) {
    const s = document.createElement('span');
    s.className = 'estouro';
    s.textContent = sorteia(['❤️', '💖', '💕', '✨']);
    s.style.left = (r.left + r.width / 2) + 'px';
    s.style.top = (r.top + r.height / 2) + 'px';
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 90;
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

$('comecar').onclick = () => { mostrar('quiz'); carregarPergunta(); };

$('form').onsubmit = async (ev) => {
  ev.preventDefault();
  const campo = $('resposta');
  if (!campo.value.trim()) return;
  $('enviar').disabled = true;
  const segredo = await testar(campo.value, DADOS.quiz[segredos.length]);
  $('enviar').disabled = false;
  if (segredo) {
    segredos.push(segredo);
    salvar();
    campo.classList.add('acertou');
    $('msg').textContent = sorteia(ACERTOS);
    $('msg').className = 'ok';
    estourarCoracoes(campo);
    setTimeout(carregarPergunta, 900);
  } else {
    $('msg').textContent = sorteia(ERROS);
    $('msg').className = '';
    campo.classList.remove('tremer');
    void campo.offsetWidth;
    campo.classList.add('tremer');
  }
};

async function abrirCarta() {
  const tudo = new Uint8Array(segredos.length * 32);
  segredos.forEach((s, i) => tudo.set(s, i * 32));
  const chave = await crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', tudo), 'AES-GCM', false, ['decrypt']);
  let surpresa;
  try {
    surpresa = JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(DADOS.carta.iv) }, chave, deB64(DADOS.carta.ct))));
  } catch (e) {
    segredos = []; salvar();
    alert('Algo deu errado, vamos recomeçar 😅');
    return location.reload();
  }
  const caixa = $('texto');
  caixa.innerHTML = '';
  surpresa.carta.split(/\n\s*\n/).forEach((par) => {
    const p = document.createElement('p');
    p.textContent = par.trim();
    caixa.appendChild(p);
  });
  prepararVale(surpresa.vale);
  estourarCoracoes($('envelope'));
  mostrar('carta');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function prepararVale(vale) {
  // validade: até o fim do dia seguinte ao dia em que ela destravou
  let destravou;
  try { destravou = Number(localStorage.getItem(CHAVE_SALVA + '-data')); } catch (e) {}
  if (!destravou) { destravou = Date.now(); try { localStorage.setItem(CHAVE_SALVA + '-data', String(destravou)); } catch (e) {} }
  const amanha = new Date(destravou); amanha.setDate(amanha.getDate() + 1);
  const data = amanha.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  $('valeTitulo').textContent = vale.titulo;
  $('valeValor').textContent = vale.valor;
  $('valeTexto').textContent = vale.texto;
  $('valeValidade').textContent = `Válido somente até amanhã (${data}) ⏳`;
  let jaAbriu = false;
  const abrir = () => { $('modalVale').classList.add('aberto'); if (!jaAbriu) { jaAbriu = true; setTimeout(() => estourarCoracoes($('valeValor')), 300); } };
  $('botaoVale').onclick = abrir;
  // abre sozinho quando ela chega no fim da carta
  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver((itens) => {
      if (itens.some((i) => i.isIntersecting)) { obs.disconnect(); setTimeout(abrir, 1200); }
    });
    setTimeout(() => obs.observe($('fimDaCarta')), 1500);
  }
}
$('fecharVale').onclick = () => $('modalVale').classList.remove('aberto');
$('modalVale').onclick = (e) => { if (e.target === $('modalVale')) $('modalVale').classList.remove('aberto'); };

$('envelope').onclick = abrirCarta;
$('envelope').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') abrirCarta(); };

if (segredos.length >= DADOS.quiz.length) mostrar('fim');
else if (segredos.length > 0) { mostrar('quiz'); carregarPergunta(); }

// corações subindo no fundo
const fundo = $('coracoes');
for (let k = 0; k < 18; k++) {
  const s = document.createElement('span');
  s.textContent = sorteia(['❤', '♡', '❥']);
  s.style.left = Math.random() * 100 + '%';
  s.style.color = sorteia(['#ff7aa2', '#e0457b', '#ffc2d4']);
  s.style.fontSize = 14 + Math.random() * 22 + 'px';
  s.style.animationDuration = 9 + Math.random() * 10 + 's';
  s.style.animationDelay = -Math.random() * 18 + 's';
  fundo.appendChild(s);
}
